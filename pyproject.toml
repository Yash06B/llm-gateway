[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible LLM gateway: fallback routing, circuit breakers, semantic caching, rate limits and cost accounting."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Bhosale" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiohttp>=3.9",
    "numpy>=1.26",
    "fastembed>=0.4",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gateway = "gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
